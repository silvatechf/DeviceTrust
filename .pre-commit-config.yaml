repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]

  - repo: https://github.com/gitguardian/ggshield
    rev: v1.56.1
    hooks:
      - id: ggshield
        language_version: python3
        stages: [pre-commit]

