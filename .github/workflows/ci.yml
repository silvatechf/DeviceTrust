name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend JavaScript syntax
        run: node --check web/app.js
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -q -r app
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Tests
        run: pytest -q

  compose-smoke:
    name: Docker Compose PostgreSQL smoke and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise Docker Compose startup, persistence and recovery
        run: bash scripts/ci-compose-smoke.sh

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devicetrust
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: devicetrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devicetrust -d devicetrust_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://devicetrust:test-password@localhost:5432/devicetrust_test
      DEVICETRUST_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: PostgreSQL migration and persistence test
        run: pytest -q tests/test_postgres_persistence.py
