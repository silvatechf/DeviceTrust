name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend JavaScript syntax
        run: node --check web/app.js
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify patched oauthlib resolution
        run: |
          python -c "from importlib.metadata import version; from packaging.version import Version; installed = Version(version('oauthlib')); print(f'oauthlib {installed}'); assert installed >= Version('4.0.1'), f'Expected patched oauthlib >=4.0.1, got {installed}'"
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Install pre-commit hook environments
        run: pre-commit install-hooks
      - name: Ruff
        run: ruff check .
      - name: Bandit
        run: bandit -q -r app
      - name: Runtime dependency audit
        run: pip-audit -r requirements.txt
      - name: Development dependency audit
        run: pip-audit -r requirements-dev.txt
      - name: Tests
        run: pytest -q

  secret-history:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1
        run: |
          set -euo pipefail
          archive=/tmp/gitleaks.tar.gz
          expected_sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          if ! printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --status; then
            echo "Gitleaks archive SHA-256 verification failed." >&2
            exit 1
          fi
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan all reachable Git history
        run: /tmp/gitleaks git --log-opts="--all --full-history" --redact=100 --no-banner --log-level=warn --exit-code=1 .

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devicetrust
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: devicetrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devicetrust -d devicetrust_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://devicetrust:test-password@localhost:5432/devicetrust_test
      DEVICETRUST_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: PostgreSQL migration and persistence test
        run: pytest -q tests/test_postgres_persistence.py

  compose-smoke:
    name: Docker Compose PostgreSQL smoke and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise Docker Compose startup, persistence and recovery
        run: bash scripts/ci-compose-smoke.sh
